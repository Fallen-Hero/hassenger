name: Validate and release Hassenger

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hassenger-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test real Home Assistant 2026.10.2
        run: >-
          docker run --rm --entrypoint python
          -e PYTHONDONTWRITEBYTECODE=1
          -v "$GITHUB_WORKSPACE:/work:ro" -w /work
          ghcr.io/home-assistant/home-assistant:2026.10.2
          tests/ha_compatibility.py

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      NODE_PATH: ${{ github.workspace }}/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source commit
        run: |
          mkdir -p "$RUNNER_TEMP/hassenger-release"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/hassenger-release"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: npm install --ignore-scripts --package-lock=false
      - run: npx playwright install --with-deps chromium firefox webkit
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
      - name: Test and build release archive
        working-directory: ${{ runner.temp }}/hassenger-release
        run: python -B scripts/build-release.py --engines chromium,firefox,webkit --output "$RUNNER_TEMP/release-assets/Hassenger-v1.0.1.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: hassenger-1.0.1-release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, home-assistant]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hassenger-1.0.1-release-assets
          path: release-assets
      - name: Publish verified v1.0.1 without replacing existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(python -c 'import json; print(json.load(open("custom_components/hassenger/manifest.json"))["version"])')" = 1.0.1
          (cd release-assets && sha256sum --check Hassenger-v1.0.1.zip.sha256)
          gh release create v1.0.1 --target "$RELEASE_SHA" --title 'Hassenger 1.0.1' --notes-file RELEASE_NOTES_1.0.1.md --latest release-assets/Hassenger-v1.0.1.zip release-assets/Hassenger-v1.0.1.zip.sha256
